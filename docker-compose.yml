services:
  mirofish:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mirofish-class
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5001:5001"
    volumes:
      - ./case_materials:/app/case_materials:ro
      - ./outputs:/app/outputs
      - ./mirofish_data:/app/data
    restart: unless-stopped
